        template_id:
          type: integer
          writeOnly: true
        specification:
          type: string
          writeOnly: true
          maxLength: 255
        created_field_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        answer_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        profile:
          allOf:
            - $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
        - answer_ids
        - created_field_ids
        - profile
        - specification
        - template_id
    CreateAnswer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
        question:
          type: string
          nullable: true
        specification:
          type: string
          writeOnly: true
          maxLength: 255
        answer:
          readOnly: true
      required:
        - answer
