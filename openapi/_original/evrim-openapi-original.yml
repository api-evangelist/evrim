components:
  schemas:
    Answer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer:
          readOnly: true
        question:
          type: string
          readOnly: true
          maxLength: 510
        source:
          type: string
          nullable: true
          maxLength: 510
      required:
        - answer
        - id
        - question
    AnswerCosts:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer_id:
          type: integer
          writeOnly: true
        total:
          type: number
          format: double
          readOnly: true
      required:
        - answer_id
        - id
        - total
    BlankProfile:
      type: object
      description: Create a blank profile
      properties:
        id:
          type: integer
          readOnly: true
      required:
        - id
    BlankTemplate:
      type: object
      description: Create a blank template
      properties:
        id:
          type: integer
          readOnly: true
      required:
        - id
    BulkJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        template_id:
          type: integer
          writeOnly: true
        specifications:
          type: array
          items:
            type: string
            maxLength: 510
          writeOnly: true
        template:
          allOf:
            - $ref: '#/components/schemas/Template'
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
        error:
          type: string
          readOnly: true
          maxLength: 1000
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
        - error
        - id
        - profiles
        - specifications
        - status
        - template
        - template_id
    BulkProfilesToCollection:
      type: object
      properties:
        collection_id:
          type: integer
          writeOnly: true
        profile_ids:
          type: array
          items:
            type: integer
          writeOnly: true
      required:
        - collection_id
        - profile_ids
    Collection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        collection:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
        - collection
        - description
        - id
        - name
    ComposeProfileSnapshot:
      type: object
      description: Compose a profile snapshot from a template, specification, fields,
        and answers
