openapi: 3.2.0
info:
  title: Evrim Costs API
  version: 0.5.18
  description: Data when and how you want it.
tags:
- name: Costs
paths:
  /prod/v0/costs/answer/:
    get:
      operationId: costs_answer_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Costs
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnswerCostsList'
          description: ''
      summary: Costs answer list
      x-summary-source: derived
  /prod/v0/costs/answer/{id}/:
    get:
      operationId: costs_answer_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this answer.
        required: true
      tags:
      - Costs
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerCosts'
          description: ''
      summary: Costs answer retrieve
      x-summary-source: derived
  /prod/v0/costs/average/answer/:
    get:
      operationId: costs_average_answer_retrieve
      description: Get avg answer cost for all answers
      tags:
      - Costs
      security:
      - knoxApiToken: []
      responses:
        '200':
          description: No response body
      summary: Costs average answer retrieve
      x-summary-source: derived
  /prod/v0/costs/average/field/:
    get:
      operationId: costs_average_field_retrieve
      description: Get avg field cost for all fields
      tags:
      - Costs
      security:
      - knoxApiToken: []
      responses:
        '200':
          description: No response body
      summary: Costs average field retrieve
      x-summary-source: derived
  /prod/v0/costs/average/field/type/:
    get:
      operationId: costs_average_field_type_retrieve
      description: Get avg field cost for all fields by field type
      tags:
      - Costs
      security:
      - knoxApiToken: []
      responses:
        '200':
          description: No response body
      summary: Costs average field type retrieve
      x-summary-source: derived
  /prod/v0/costs/created-field/:
    get:
      operationId: costs_created_field_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Costs
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreatedFieldCostsList'
          description: ''
      summary: Costs created field list
      x-summary-source: derived
  /prod/v0/costs/created-field/{id}/:
    get:
      operationId: costs_created_field_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this created field.
        required: true
      tags:
      - Costs
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedFieldCosts'
          description: ''
      summary: Costs created field retrieve
      x-summary-source: derived
  /prod/v0/costs/snapshot/{id}/:
    get:
      operationId: costs_snapshot_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this snapshot.
        required: true
      tags:
      - Costs
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotCost'
          description: ''
      summary: Costs snapshot retrieve
      x-summary-source: derived
components:
  schemas:
    SnapshotCost:
      type: object
      properties:
        id:
          type: integer
          writeOnly: true
        field_costs:
          type: number
          format: double
          readOnly: true
        answer_costs:
          type: number
          format: double
          readOnly: true
        total_cost:
          type: number
          format: double
          readOnly: true
      required:
      - answer_costs
      - field_costs
      - id
      - total_cost
    AnswerCosts:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer_id:
          type: integer
          writeOnly: true
        total:
          type: number
          format: double
          readOnly: true
      required:
      - answer_id
      - id
      - total
    PaginatedCreatedFieldCostsList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/CreatedFieldCosts'
    PaginatedAnswerCostsList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/AnswerCosts'
    CreatedFieldCosts:
      type: object
      properties:
        field_id:
          type: integer
          writeOnly: true
        id:
          type: integer
          readOnly: true
        total:
          type: number
          format: double
          readOnly: true
      required:
      - field_id
      - id
      - total
  securitySchemes:
    knoxApiToken:
      type: http
      scheme: bearer
