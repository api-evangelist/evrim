openapi: 3.2.0
info:
  title: Evrim Answers API
  version: 0.5.18
  description: Data when and how you want it.
tags:
- name: Answers
paths:
  /prod/v0/answers/:
    get:
      operationId: answers_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Answers
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreateAnswerList'
          description: ''
      summary: Answers list
      x-summary-source: derived
    post:
      operationId: answers_create
      tags:
      - Answers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnswer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAnswer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAnswer'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnswer'
          description: ''
      summary: Answers create
      x-summary-source: derived
  /prod/v0/answers/{id}/:
    get:
      operationId: answers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this answer.
        required: true
      tags:
      - Answers
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnswer'
          description: ''
      summary: Answers retrieve
      x-summary-source: derived
components:
  schemas:
    PaginatedCreateAnswerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/CreateAnswer'
    CreateAnswer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
        question:
          type:
          - string
          - 'null'
        specification:
          type: string
          writeOnly: true
          maxLength: 255
        answer:
          readOnly: true
      required:
      - answer
      - id
      - specification
      - status
  securitySchemes:
    knoxApiToken:
      type: http
      scheme: bearer
