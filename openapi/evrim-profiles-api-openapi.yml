openapi: 3.2.0
info:
  title: Evrim Profiles API
  version: 0.5.18
  description: Data when and how you want it.
tags:
- name: Profiles
paths:
  /prod/v0/profiles/:
    get:
      operationId: profiles_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: specification
        schema:
          type: string
      tags:
      - Profiles
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfileList'
          description: ''
      summary: Profiles list
      x-summary-source: derived
    post:
      operationId: profiles_create
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Profile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Profile'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
      summary: Profiles create
      x-summary-source: derived
  /prod/v0/profiles/{id}/:
    get:
      operationId: profiles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this profile.
        required: true
      tags:
      - Profiles
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
      summary: Profiles retrieve
      x-summary-source: derived
    put:
      operationId: profiles_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this profile.
        required: true
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Profile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Profile'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
      summary: Profiles update
      x-summary-source: derived
    patch:
      operationId: profiles_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this profile.
        required: true
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfile'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
      summary: Profiles partial update
      x-summary-source: derived
    delete:
      operationId: profiles_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this profile.
        required: true
      tags:
      - Profiles
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
      summary: Profiles destroy
      x-summary-source: derived
  /prod/v0/profiles/{profile_id}/collections/:
    post:
      operationId: profiles_collections_create
      description: Add a profile to a collection
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileToCollection'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileToCollection'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileToCollection'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileToCollection'
          description: ''
      summary: Profiles collections create
      x-summary-source: derived
  /prod/v0/profiles/{profile_id}/created-fields/:
    post:
      operationId: profiles_created_fields_create
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatedFieldsToProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatedFieldsToProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatedFieldsToProfile'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedFieldsToProfile'
          description: ''
      summary: Profiles created fields create
      x-summary-source: derived
  /prod/v0/profiles/{profile_id}/latest/:
    get:
      operationId: profiles_latest_list
      description: Get the latest snapshot for a profile based on the profile id and created date
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: profile_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Profiles
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLatestSnapshotList'
          description: ''
      summary: Profiles latest list
      x-summary-source: derived
  /prod/v0/profiles/{profile_id}/latest/relationships/:
    get:
      operationId: profiles_latest_relationships_retrieve
      description: Get relationships for a snapshot as records for easy usage
      parameters:
      - in: path
        name: profile_id
        schema:
          type: integer
        required: true
      tags:
      - Profiles
      security:
      - knoxApiToken: []
      responses:
        '200':
          description: No response body
      summary: Profiles latest relationships retrieve
      x-summary-source: derived
  /prod/v0/profiles/{profile_id}/reports/:
    get:
      operationId: profiles_reports_list
      description: Get all reports associated with a profile by looking up outlines and then reports
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Profiles
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
          description: ''
      summary: Profiles reports list
      x-summary-source: derived
  /prod/v0/profiles/{profile_id}/snapshots/:
    get:
      operationId: profiles_snapshots_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: profile_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Profiles
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreateProfileSnapshotList'
          description: ''
      summary: Profiles snapshots list
      x-summary-source: derived
    post:
      operationId: profiles_snapshots_create
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileSnapshot'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateProfileSnapshot'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateProfileSnapshot'
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProfileSnapshot'
          description: ''
      summary: Profiles snapshots create
      x-summary-source: derived
  /prod/v0/profiles/{profile_id}/snapshots/{snapshot_id}/:
    get:
      operationId: profiles_snapshots_retrieve
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: snapshot_id
        schema:
          type: string
        required: true
      tags:
      - Profiles
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProfileSnapshot'
          description: ''
      summary: Profiles snapshots retrieve
      x-summary-source: derived
  /prod/v0/profiles/{profile_id}/tag/:
    post:
      operationId: profiles_tag_create
      description: Tag a profile
      parameters:
      - in: path
        name: profile_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagProfile'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagProfile'
          description: ''
      summary: Profiles tag create
      x-summary-source: derived
components:
  schemas:
    PaginatedLatestSnapshotList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/LatestSnapshot'
    Template:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type:
          - string
          - 'null'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        questions:
          type: array
          items:
            type: string
            maxLength: 255
      required:
      - fields
      - id
      - name
    LatestSnapshot:
      type: object
      properties:
        specification:
          type: string
          readOnly: true
          maxLength: 255
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CreatedField'
          readOnly: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
          readOnly: true
      required:
      - answers
      - fields
      - specification
    CreatedField:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          writeOnly: true
          maxLength: 255
        specification:
          type: string
          writeOnly: true
          maxLength: 255
        source_entity_type:
          type:
          - string
          - 'null'
          writeOnly: true
          maxLength: 255
        description:
          type: string
          writeOnly: true
          maxLength: 255
        type:
          type: string
          writeOnly: true
          maxLength: 3
        enum_values:
          type: array
          items:
            type: string
            maxLength: 255
          writeOnly: true
        enum_many:
          type: boolean
          writeOnly: true
        rel_template:
          allOf:
          - $ref: '#/components/schemas/Template'
          writeOnly: true
        field:
          allOf:
          - $ref: '#/components/schemas/Field'
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
        value:
          readOnly: true
        sources:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 255
          writeOnly: true
        directed_source:
          type:
          - string
          - 'null'
          writeOnly: true
          maxLength: 255
        keyword_search:
          type:
          - boolean
          - 'null'
        raw_documents:
          type:
          - boolean
          - 'null'
      required:
      - description
      - field
      - id
      - name
      - specification
      - status
      - type
      - value
    PaginatedProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
    Snapshot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
          readOnly: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CreatedField'
          readOnly: true
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
          readOnly: true
      required:
      - answers
      - fields
      - id
      - reports
      - status
    Report:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        profile_id:
          type: integer
          writeOnly: true
        outline_id:
          type: integer
          writeOnly: true
        outline:
          allOf:
          - $ref: '#/components/schemas/Outline'
          readOnly: true
        report:
          readOnly: true
      required:
      - id
      - outline
      - outline_id
      - profile_id
      - report
    Tag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type:
          - string
          - 'null'
      required:
      - id
      - name
    PaginatedCreateProfileSnapshotList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/CreateProfileSnapshot'
    Outline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        profile_id:
          type: integer
          writeOnly: true
        report_title:
          type: string
          writeOnly: true
          maxLength: 255
        section_titles:
          type: array
          items:
            type: string
            maxLength: 255
          writeOnly: true
        outline: {}
        perspective:
          type: string
          maxLength: 255
      required:
      - id
      - perspective
      - profile_id
      - report_title
      - section_titles
    PatchedProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        template_id:
          type: integer
          writeOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        specification:
          type: string
          maxLength: 510
        source_map:
          writeOnly: true
        source:
          type: string
          writeOnly: true
          maxLength: 255
        template:
          allOf:
          - $ref: '#/components/schemas/Template'
          readOnly: true
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
          readOnly: true
    TagProfile:
      type: object
      properties:
        tag_id:
          type: integer
          writeOnly: true
      required:
      - tag_id
    Answer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer:
          readOnly: true
        question:
          type: string
          readOnly: true
          maxLength: 510
        source:
          type:
          - string
          - 'null'
          maxLength: 510
      required:
      - answer
      - id
      - question
    Field:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 3
        rel_template_id:
          type:
          - integer
          - 'null'
          writeOnly: true
        rel_template:
          type:
          - integer
          - 'null'
          readOnly: true
        enum_values:
          type: array
          items:
            type: string
            maxLength: 255
        enum_many:
          type: boolean
        sources:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 255
        directed:
          type: boolean
          default: false
        keyword_search:
          type: boolean
          default: true
        raw_documents:
          type: boolean
          default: false
      required:
      - description
      - name
      - rel_template
      - type
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        template_id:
          type: integer
          writeOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        specification:
          type: string
          maxLength: 510
        source_map:
          writeOnly: true
        source:
          type: string
          writeOnly: true
          maxLength: 255
        template:
          allOf:
          - $ref: '#/components/schemas/Template'
          readOnly: true
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
          readOnly: true
      required:
      - id
      - snapshots
      - specification
      - template
      - template_id
    ProfileToCollection:
      type: object
      properties:
        collection_id:
          type: integer
          writeOnly: true
      required:
      - collection_id
    CreatedFieldsToProfile:
      type: object
      properties:
        field_ids:
          type: array
          items:
            type: integer
          writeOnly: true
      required:
      - field_ids
    CreateProfileSnapshot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
          readOnly: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CreatedField'
          readOnly: true
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
          readOnly: true
      required:
      - answers
      - fields
      - id
      - reports
  securitySchemes:
    knoxApiToken:
      type: http
      scheme: bearer
