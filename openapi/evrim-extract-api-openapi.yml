          description: ''
      summary: Extract raw list
      x-summary-source: derived
    post:
      operationId: extract_raw_create
      tags:
      - Extract
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Extraction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Extraction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Extraction'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Extraction'
          description: ''
      summary: Extract raw create
      x-summary-source: derived
  /prod/v0/extract/raw/{id}/:
    get:
      operationId: extract_raw_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this extraction.
        required: true
      tags:
      - Extract
      security:
      - knoxApiToken: []
      responses:
        '200':
