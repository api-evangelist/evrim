components:
  schemas:
    ExtractValue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
        name:
          type: string
          maxLength: 510
        type:
          type: string
          maxLength: 510
        description:
          type: string
          maxLength: 510
        specification:
          type: string
          maxLength: 510
        rerank:
          type: boolean
          default: true
        source:
          type: string
          maxLength: 510
        raw_documents:
          type: boolean
          default: false
        keyword_search:
          type: boolean
          default: true
        urls:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 510
        extraction:
          readOnly: true
      required:
      - description
      - extraction
      - id
      - name
      - source
      - specification
      - status
      - type
    ExtractRelationship:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        specification:
          type: string
          maxLength: 510
        source:
          type: string
          maxLength: 510
        relationship:
          type: string
          maxLength: 510
        target:
          type: string
          maxLength: 510
        url:
          type: string
          maxLength: 510
        extraction:
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
      required:
      - extraction
      - id
      - relationship
      - source
      - specification
      - status
      - target
      - url
    Extraction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        query:
          type: string
          maxLength: 510
        source:
          type: string
          maxLength: 510
        extraction:
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
        error:
          type: string
          readOnly: true
          maxLength: 1000
      required:
      - error
      - extraction
      - id
      - query
      - source
      - status
    PaginatedExtractionCommandList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionCommand'
    PaginatedExtractValueList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExtractValue'
    PaginatedExtractionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Extraction'
    PaginatedExtractRelationshipList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ExtractRelationship'
    ExtractionCommand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        query:
          type: string
          maxLength: 510
        extraction:
          readOnly: true
        status:
          type: string
          readOnly: true
          maxLength: 1
        error:
          type: string
          readOnly: true
          maxLength: 1000
      required:
      - error
      - extraction
      - id
      - query
      - status
  securitySchemes:
    knoxApiToken:
      type: http
      scheme: bearer
