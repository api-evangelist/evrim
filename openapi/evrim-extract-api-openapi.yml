openapi: 3.2.0
info:
  title: Evrim Extract API
  version: 0.5.18
  description: Data when and how you want it.
tags:
- name: Extract
paths:
  /prod/v0/extract/command/:
    get:
      operationId: extract_command_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Extract
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExtractionCommandList'
          description: ''
      summary: Extract command list
      x-summary-source: derived
    post:
      operationId: extract_command_create
      tags:
      - Extract
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionCommand'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExtractionCommand'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExtractionCommand'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionCommand'
          description: ''
      summary: Extract command create
      x-summary-source: derived
  /prod/v0/extract/command/{id}/:
    get:
      operationId: extract_command_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this extraction.
        required: true
      tags:
      - Extract
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionCommand'
          description: ''
      summary: Extract command retrieve
      x-summary-source: derived
  /prod/v0/extract/raw/:
    get:
      operationId: extract_raw_list
      parameters:
      - name: limit
