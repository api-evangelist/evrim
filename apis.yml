aid: evrim
name: Evrim
description: >-
  Evrim is the upstream signal layer for U.S. financial institutions, the
  defense industrial base, and federal agencies. The Evrim REST API ("Data when
  and how you want it.", v0.5.18) builds structured intelligence profiles from
  reusable templates and fields, captures point-in-time snapshots, and extracts
  values and relationships from source content. Every operation authenticates
  with a Knox-issued API token sent as an HTTP Bearer credential, and an
  official Stainless-generated Python SDK is published on PyPI.
